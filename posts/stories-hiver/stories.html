<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>
:root{--bg:#F5F0E6;--ink:#2A231B;--soft:#6E6253;--bronze:#96754A;--bronze-ink:#7A5D36;--line:#D9CDB8;--panel:#EDE5D6}
*{margin:0;padding:0;box-sizing:border-box}
section{width:1080px;height:1920px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Liberation Sans",sans-serif;text-align:center}
section::after{content:"";position:absolute;inset:44px;border:1px solid var(--line)}
/* empty arch y 300-960 holding a line icon; text 1020-1260; sticker room 1300-1600 */
.arch{position:absolute;left:250px;width:580px;top:300px;height:660px;border-radius:290px 290px 0 0;background:var(--panel);outline:2px solid var(--bronze);outline-offset:14px;display:flex;align-items:center;justify-content:center}
.ico{width:300px;height:300px;color:var(--bronze);margin-top:60px}
.lab{position:absolute;left:0;right:0;top:1050px;font-size:28px;letter-spacing:8px;text-transform:uppercase;color:var(--bronze-ink)}
h1{position:absolute;left:130px;right:130px;top:1105px;font-family:"Bitstream Charter","Liberation Serif",serif;font-weight:400;font-size:68px;line-height:1.15}
</style></head><body>
<section data-name="story-1"><div class="arch"><svg class="ico" viewBox="0 0 300 300"><g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"><path d="M150 60 V240 M72 105 L228 195 M72 195 L228 105"/><path d="M130 75 L150 95 L170 75 M130 225 L150 205 L170 225"/></g></svg></div><div class="lab">L'hiver arrive</div><h1>Votre bien est-il prêt pour l'hiver ?</h1></section>
